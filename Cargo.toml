[package]
name = "hash_calculator"
version = "0.4.1"
edition = "2021"
authors = ["cocolight"]
license = "GPL-3.0-only"
description = "Lightweight MD5/SHA-256 hash calculator built with Rust + egui"
repository = "https://github.com/cocolight/HashCalculator"
keywords = ["hash", "md5", "sha256", "egui", "calculator"]
categories = ["cryptography", "gui"]

[dependencies]
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
memmap2 = "0.9"
md-5 = "0.11"
sha2 = "0.11"
hex = "0.4"
arboard = "3.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
