[package]
name = "hash_calculator"
version = "0.4.2"
edition = "2021"
authors = ["cocolight"]
license = "GPL-3.0-only"
description = "Lightweight MD5/SHA-256 hash calculator built with Rust + egui"
repository = "https://github.com/cocolight/HashCalculator"
keywords = ["hash", "md5", "sha256", "egui", "calculator"]
categories = ["cryptography", "gui"]

[dependencies]
# 显式关闭默认 feature：eframe 0.36 的 `default` 携带的是 `wgpu` 后端，
# 而 wgpu 在空载时就要拉起 DX12/Vulkan 运行时与 GPU 资源池（实测 private 内存 250MB+）。
# 换成 `glow`（OpenGL）后端后同场景内存大幅下降，对这类轻量工具是纯收益。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
rfd = "0.17"
memmap2 = "0.9"
md-5 = "0.11"
sha2 = "0.11"
hex = "0.4"
arboard = "3.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
